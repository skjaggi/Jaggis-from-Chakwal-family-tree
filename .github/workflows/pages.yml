# Publishes the site/ folder to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild daily so the public ancestor pages follow changes made in the tree.
  schedule:
    - cron: '30 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp every script and stylesheet link with this commit, so a refresh
      # always loads the new version instead of a cached old file.
      - name: Cache-bust script and style links
        run: |
          v=${GITHUB_SHA::8}
          sed -i -E "s#(from '\./[a-z0-9-]+\.js)'#\1?v=$v'#g" site/js/*.js
          sed -i -E "s#(src=\"js/main\.js)\"#\1?v=$v\"#; s#(href=\"css/app\.css)\"#\1?v=$v\"#" site/*.html
          grep -c "?v=$v" site/index.html site/js/main.js
      # Plain pages for search engines: deceased family members only, public
      # details only, plus sitemap.xml. If the database can't be reached the
      # site still deploys, just without these pages.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build public ancestor pages and sitemap
        run: node scripts/build-public-pages.mjs || echo "::warning::Public ancestor pages were not built"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
