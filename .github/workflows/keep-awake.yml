# Supabase pauses free projects after about a week without activity.
# This makes one small read every three days so the family tree stays awake.
name: Keep database awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read one row
        run: |
          URL=$(sed -n "s/^ *supabaseUrl: '\(.*\)',/\1/p" site/js/config.js)
          KEY=$(sed -n "s/^ *supabaseAnonKey: '\(.*\)',/\1/p" site/js/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase not configured yet"; exit 0; fi
          curl -fsS "$URL/rest/v1/people?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "ok"
